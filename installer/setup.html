<!doctype html>
<html lang="fr" data-theme="dark"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>WinLand</title>
<!--
  WinLand's installer and uninstaller (installer-main.cjs does the work). Pip on the left reacts to every step:
  he looks at your mouse, his eyes go orange while installing, green when done, and droop when you uninstall.
-->
<style>
  @font-face{font-family:Inter;src:url('../assets/fonts/inter-latin-opsz-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
  @font-face{font-family:Inter;src:url('../assets/fonts/inter-latin-ext-opsz-normal.woff2') format('woff2');font-weight:100 900;font-display:block;unicode-range:U+0100-024F,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
  :root{
    --bg:#0b0b10;--panel:rgba(255,255,255,.035);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
    --text:#f5f5f7;--dim:#9b9ba6;--faint:#6b6b76;--chip:rgba(255,255,255,.06);--chip-on:#ffffff;--chip-on-text:#0b0b10;
    --violet:#7c5cff;--blue:#1aa7ff;--grad:linear-gradient(135deg,#7c5cff,#1aa7ff);
    --glow1:rgba(124,92,255,.38);--glow2:rgba(26,167,255,.30);--stage:rgba(255,255,255,.025);
    --pip1:#ffffff;--pip2:#dedee6;--eye:#1c1c1e;--danger:#ff453a;--good:#30d158;--busy:#ff9f0a;
    --shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07) inset;
  }
  :root[data-theme="light"]{
    --bg:#f5f5f9;--panel:rgba(0,0,0,.025);--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
    --text:#121218;--dim:#62626e;--faint:#9a9aa5;--chip:rgba(0,0,0,.05);--chip-on:#121218;--chip-on-text:#ffffff;
    --glow1:rgba(124,92,255,.22);--glow2:rgba(26,167,255,.18);--stage:rgba(255,255,255,.6);
    --shadow:0 30px 80px rgba(20,20,60,.25),0 0 0 1px rgba(0,0,0,.06) inset;
  }
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none !important}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{font:14px/1.45 Inter,"Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;padding:10px}
  .shell{position:relative;height:100%;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);display:grid;grid-template-columns:330px 1fr;
    animation:pop .5s cubic-bezier(.2,.9,.2,1.1) both;transition:background .4s}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
  .shell::before,.shell::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(70px);pointer-events:none;transition:background .6s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
  .shell::before{left:-200px;top:-220px;background:var(--glow1)}
  .shell::after{right:-240px;bottom:-260px;background:var(--glow2)}
  body.busy .shell::before{background:rgba(255,159,10,.30)}
  body.done .shell::before{background:rgba(48,209,88,.28)}
  body.bye .shell::after{background:rgba(255,69,58,.18)}

  /* ---------- top bar ---------- */
  .bar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 14px 0 22px;gap:10px;-webkit-app-region:drag;z-index:5}
  .bar .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px;letter-spacing:-.1px}
  .bar .logo{width:22px;height:22px;border-radius:7px;background:var(--grad);display:grid;place-items:center}
  .bar .logo i{width:13px;height:11px;border-radius:4px;background:#fff;position:relative}
  .bar .logo i::before,.bar .logo i::after{content:"";position:absolute;top:3.5px;width:2.2px;height:3.4px;border-radius:2px;background:#1c1c1e}
  .bar .logo i::before{left:3.2px}.bar .logo i::after{right:3.2px}
  .bar .ver{font-size:11px;font-weight:600;color:var(--dim);padding:2px 8px;border-radius:99px;background:var(--chip)}
  .bar .sp{flex:1}
  .win{-webkit-app-region:no-drag;width:34px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
  .win:hover{background:var(--chip);color:var(--text)}.win.x:hover{background:#e5484d;color:#fff}
  .win:disabled{opacity:.3;pointer-events:none}

  /* ---------- the stage: Pip ---------- */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:var(--stage);border-right:1px solid var(--line);z-index:1;transition:background .4s}
  .disc{position:relative;width:230px;height:230px;display:grid;place-items:center}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--ring,rgba(124,92,255,.22)) 0%,transparent 68%);transition:background .6s;animation:breathe 4s ease-in-out infinite}
  .disc::after{content:"";position:absolute;inset:18px;border-radius:50%;border:1px dashed var(--line2);animation:spin 40s linear infinite}
  body.busy .disc{--ring:rgba(255,159,10,.26)} body.busy .disc::after{animation-duration:3s;border-color:rgba(255,159,10,.45)}
  body.done .disc{--ring:rgba(48,209,88,.26)} body.bye .disc{--ring:rgba(255,69,58,.14)}
  @keyframes breathe{50%{transform:scale(1.08)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pip{position:relative;width:150px;height:128px;border-radius:44px;background:linear-gradient(180deg,var(--pip1),var(--pip2));
    box-shadow:0 22px 40px rgba(0,0,0,.35),inset 0 -6px 14px rgba(0,0,0,.06),inset 0 2px 0 rgba(255,255,255,.9);animation:float 3.6s ease-in-out infinite;transition:transform .5s}
  :root[data-theme="light"] .pip{box-shadow:0 22px 40px rgba(40,40,90,.18),inset 0 -6px 14px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.05)}
  @keyframes float{50%{translate:0 -9px}}
  body.busy .pip{animation:float 1.1s ease-in-out infinite}
  body.done .pip{animation:hop .55s cubic-bezier(.3,1.6,.5,1) 3,float 3.6s 1.7s ease-in-out infinite}
  @keyframes hop{50%{translate:0 -22px}}
  .eyes{position:absolute;left:50%;top:50%;display:flex;gap:30px;transform:translate(calc(-50% + var(--lx,0px)),calc(-50% + var(--ly,0px)));transition:transform .18s ease-out}
  .eye{width:21px;height:31px;border-radius:12px;background:var(--eye-c,var(--eye));transform-origin:center;animation:blink 4.2s infinite;transition:background .4s,height .3s,border-radius .3s,transform .3s,box-shadow .4s}
  body.busy .eye{--eye-c:var(--busy);box-shadow:0 0 14px rgba(255,159,10,.7)}
  body.done .eye{--eye-c:var(--good);box-shadow:0 0 14px rgba(48,209,88,.6);height:13px;border-radius:13px 13px 3px 3px;animation:none}
  body.bye .eye{height:24px;animation:blink 6s infinite}
  body.bye .eye:first-child{transform:rotate(18deg) translateY(4px)} body.bye .eye:last-child{transform:rotate(-18deg) translateY(4px)}
  body.gone .eye{height:4px;border-radius:3px;animation:none}
  @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
  .shadow{width:110px;height:14px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%);margin-top:-22px;animation:shade 3.6s ease-in-out infinite}
  :root[data-theme="light"] .shadow{background:radial-gradient(rgba(30,30,80,.18),transparent 70%)}
  @keyframes shade{50%{transform:scale(.82);opacity:.7}}
  .say{position:absolute;top:84px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:14px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;
    opacity:0;translate:0 6px;transition:opacity .3s,translate .3s}
  .say.on{opacity:1;translate:0 0}
  .dots{display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:width .35s cubic-bezier(.2,.8,.2,1),background .35s}
  .dots i.on{width:24px;background:var(--grad)}
  .dots i.past{background:var(--dim)}

  /* ---------- the pages ---------- */
  .pages{position:relative;z-index:1}
  .page{position:absolute;inset:52px 0 0 0;padding:26px 46px 34px 44px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(26px);transition:opacity .38s,transform .5s cubic-bezier(.2,.8,.2,1)}
  .page.on{opacity:1;pointer-events:auto;transform:none}
  .page.left{transform:translateX(-26px)}
  .page > *{animation:none}
  .page.on > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .page.on > *:nth-child(2){animation-delay:.05s}.page.on > *:nth-child(3){animation-delay:.1s}.page.on > *:nth-child(4){animation-delay:.15s}.page.on > *:nth-child(5){animation-delay:.2s}.page.on > *:nth-child(6){animation-delay:.25s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .kicker{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;color:transparent;margin-top:26px}
  h1{font-size:38px;line-height:1.08;letter-spacing:-1.2px;font-weight:750;margin-top:10px}
  h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;color:transparent}
  h2{font-size:26px;letter-spacing:-.6px;font-weight:720;line-height:1.15}
  .lead{color:var(--dim);font-size:14.5px;margin-top:12px;max-width:420px}
  .feats{display:grid;gap:10px;margin-top:26px}
  .feat{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:550}
  .feat span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line);flex:none}
  .feat svg{width:16px;height:16px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .note{margin-top:18px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .note b{color:var(--text);font-weight:600}
  .grow{flex:1}
  .actions{display:flex;align-items:center;gap:10px}
  .actions .sp{flex:1}
  .btn{height:44px;padding:0 22px;border:0;border-radius:13px;font:650 14px Inter,"Segoe UI",sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:transform .12s,filter .2s,background .2s,box-shadow .2s;color:var(--text);background:var(--chip)}
  .btn:hover{background:var(--line2)}
  .btn:active{transform:scale(.97)}
  .btn.main{color:#fff;background:var(--grad);box-shadow:0 10px 28px rgba(92,110,255,.4)}
  .btn.main:hover{filter:brightness(1.1);box-shadow:0 12px 34px rgba(92,110,255,.55)}
  .btn.danger{color:#fff;background:var(--danger);box-shadow:0 10px 26px rgba(255,69,58,.35)}
  .btn.danger:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--dim)}.btn.ghost:hover{color:var(--text);background:var(--chip)}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .btn:hover svg.go{transform:translateX(3px)}

  /* options */
  .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:15px;margin-top:18px}
  .label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .seg{display:flex;padding:4px;border-radius:12px;background:var(--chip);border:1px solid var(--line);position:relative}
  .seg button{flex:1;height:32px;border:0;border-radius:9px;background:transparent;color:var(--dim);font:600 13px Inter,"Segoe UI",sans-serif;cursor:pointer;position:relative;z-index:1;transition:color .25s}
  .seg button.on{color:var(--chip-on-text)}
  .seg .knob{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--chip-on);transition:left .35s cubic-bezier(.2,.9,.2,1.1),width .35s}
  .profiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .prof{height:82px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 4px;font:600 11.5px Inter,"Segoe UI",sans-serif;letter-spacing:-.15px;transition:transform .15s,border-color .2s,background .2s,box-shadow .25s}
  .prof:hover{transform:translateY(-2px);border-color:var(--line2)}
  .prof span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .prof svg{width:18px;height:18px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .prof.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel));box-shadow:0 0 0 1px var(--c),0 10px 26px color-mix(in srgb,var(--c) 25%,transparent)}
  .prof.on span{transform:scale(1.12)}
  .phelp{font-size:12px;color:var(--dim);margin-top:8px;min-height:18px}
  .toggles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .tog{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
  .tog:hover{border-color:var(--line2)}
  .tog div{flex:1;min-width:0}.tog b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tog small{display:block;font-size:11.5px;color:var(--dim)}
  .sw{width:40px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:none;transition:background .25s}
  .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .3s cubic-bezier(.2,.9,.2,1.2)}
  .tog.on .sw{background:var(--grad)}.tog.on .sw::after{left:19px}
  .tog.red.on .sw{background:var(--good)}

  /* progress */
  .prog{margin-top:30px}
  .pct{font-size:64px;font-weight:780;letter-spacing:-2.5px;line-height:1;font-variant-numeric:tabular-nums}
  .pct small{font-size:24px;letter-spacing:-.5px;color:var(--dim);font-weight:650;margin-left:2px}
  .track{height:12px;border-radius:7px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin-top:18px;position:relative}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:var(--grad);transition:width .35s ease-out;overflow:hidden}
  .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);animation:shine 1.3s linear infinite;transform:translateX(-100%)}
  @keyframes shine{to{transform:translateX(100%)}}
  body.bye .fill{background:linear-gradient(135deg,#ff6b5e,#ff3b30)}
  .stepline{margin-top:14px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:9px;min-height:20px}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--text);animation:spin .8s linear infinite}
  .checks{display:grid;gap:9px;margin-top:26px}
  .chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faint);transition:color .3s}
  .chk i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:background .3s,border-color .3s;flex:none}
  .chk i svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .chk.now{color:var(--text)}.chk.now i{border-color:var(--text)}
  .chk.ok{color:var(--text)}.chk.ok i{background:var(--good);border-color:var(--good)}.chk.ok i svg{opacity:1;transform:none}
  .err{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,69,58,.12);color:#ff6961;font-size:12.5px;display:none}
  .err.on{display:block}
  canvas#confetti{position:absolute;inset:0;pointer-events:none;z-index:4}
</style></head>
<body>
<div class="shell">
  <div class="bar">
    <div class="brand"><span class="logo"><i></i></span>WinLand <span class="ver" id="ver"></span></div>
    <div class="sp"></div>
    <button class="win" id="min" aria-label="Réduire"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="win x" id="close" aria-label="Fermer"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>

  <div class="stage">
    <div class="say" id="say"></div>
    <div class="disc"><div class="pip" id="pip"><div class="eyes" id="eyes"><i class="eye"></i><i class="eye"></i></div></div></div>
    <div class="shadow"></div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="pages" id="pages">
    <!-- install: welcome -->
    <section class="page" data-page="welcome">
      <p class="kicker" data-t="kicker"></p>
      <h1 data-t="welcome"></h1>
      <p class="lead" data-t="welcomeLead"></p>
      <div class="feats">
        <div class="feat"><span style="--c:#ff9f0a"><svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg></span><t data-t="f1"></t></div>
        <div class="feat"><span style="--c:#ff375f"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><t data-t="f2"></t></div>
        <div class="feat"><span style="--c:#30d158"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><t data-t="f3"></t></div>
      </div>
      <div class="grow"></div>
      <p class="note" id="update" hidden></p>
      <div class="actions" style="margin-top:14px"><div class="sp"></div><button class="btn main" data-go="options"><t data-t="start"></t><svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </section>

    <!-- install: your WinLand -->
    <section class="page" data-page="options">
      <h2 data-t="optTitle"></h2>
      <p class="lead" style="margin-top:6px" data-t="optLead"></p>
      <div class="opts">
        <div class="row2">
          <div><p class="label" data-t="lang"></p><div class="seg" data-seg="lang"><i class="knob"></i><button data-v="fr">Français</button><button data-v="en">English</button></div></div>
          <div><p class="label" data-t="theme"></p><div class="seg" data-seg="theme"><i class="knob"></i><button data-v="dark" data-t="dark"></button><button data-v="light" data-t="light"></button></div></div>
        </div>
        <div><p class="label" data-t="profile"></p><div class="profiles" id="profiles"></div><p class="phelp" id="phelp"></p></div>
        <div class="toggles">
          <div class="tog on" data-tog="autostart"><div><b data-t="autostart"></b><small data-t="autostartHelp"></small></div><i class="sw"></i></div>
          <div class="tog on" data-tog="desktop"><div><b data-t="desktop"></b><small data-t="desktopHelp"></small></div><i class="sw"></i></div>
        </div>
      </div>
      <div class="grow"></div>
      <div class="actions"><button class="btn ghost" data-go="welcome"><t data-t="back"></t></button><div class="sp"></div>
        <button class="btn main" id="doInstall"><t data-t="install"></t><svg class="go" viewBox="0 0 24 24"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></button></div>
    </section>

    <!-- working (install or uninstall) -->
    <section class="page" data-page="work">
      <p class="kicker" id="workKicker"></p>
      <h2 id="workTitle" style="margin-top:10px"></h2>
      <div class="prog">
        <div class="pct"><span id="pct">0</span><small>%</small></div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="stepline"><i class="spinner"></i><span id="stepText"></span></div>
      </div>
      <div class="checks" id="checks"></div>
      <div class="err" id="err"></div>
      <div class="grow"></div>
      <div class="actions" id="retry" hidden><div class="sp"></div><button class="btn main" id="retryBtn" data-t="retry"></button></div>
    </section>

    <!-- install: done -->
    <section class="page" data-page="done">
      <p class="kicker" data-t="doneKicker"></p>
      <h1 data-t="doneTitle"></h1>
      <p class="lead" data-t="doneLead"></p>
      <div class="feats">
        <div class="feat"><span style="--c:#7c5cff"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg></span><t data-t="tip1"></t></div>
        <div class="feat"><span style="--c:#1aa7ff"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><t data-t="tip2"></t></div>
      </div>
      <div class="grow"></div>
      <div class="actions"><button class="btn ghost" data-act="close"><t data-t="close"></t></button><div class="sp"></div>
        <button class="btn main" data-act="launch"><t data-t="launch"></t><svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </section>

    <!-- uninstall: are you sure -->
    <section class="page" data-page="bye">
      <p class="kicker" data-t="byeKicker"></p>
      <h1 data-t="byeTitle"></h1>
      <p class="lead" data-t="byeLead"></p>
      <div class="toggles" style="grid-template-columns:1fr;margin-top:26px;max-width:420px">
        <div class="tog red on" data-tog="keepSettings"><div><b data-t="keep"></b><small data-t="keepHelp"></small></div><i class="sw"></i></div>
      </div>
      <div class="grow"></div>
      <div class="actions"><button class="btn ghost" data-act="close"><t data-t="cancel"></t></button><div class="sp"></div>
        <button class="btn danger" id="doUninstall"><t data-t="uninstall"></t></button></div>
    </section>

    <!-- uninstall: gone -->
    <section class="page" data-page="gone">
      <p class="kicker" data-t="goneKicker"></p>
      <h1 data-t="goneTitle"></h1>
      <p class="lead" data-t="goneLead"></p>
      <div class="grow"></div>
      <div class="actions"><div class="sp"></div><button class="btn main" data-act="close"><t data-t="close"></t></button></div>
    </section>
  </div>
  <canvas id="confetti"></canvas>
</div>

<script>
const q = new URLSearchParams(location.search), MODE = q.get('mode') || 'install', VERSION = q.get('version') || '', INSTALLED = q.get('installed') || '';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const WORDS = {
  fr: {
    kicker: 'Installation', welcome: 'Bienvenue dans <em>WinLand</em>', welcomeLead: 'Ta Dynamic Island pour Windows, avec Pip. Elle vit en haut de ton écran et reste 100 % sur ton PC.',
    f1: 'Suit Claude Code et Codex pendant qu’ils bossent', f2: 'Ta musique, ton focus et tes fichiers sous la main', f3: 'Rien en ligne : tout reste chez toi',
    start: 'Commencer', update: v => `WinLand <b>${v}</b> est déjà installé : il sera mis à jour, tes réglages restent.`,
    optTitle: 'Ton WinLand', optLead: 'Tout se change plus tard dans les paramètres.', lang: 'Langue', theme: 'Thème', dark: 'Sombre', light: 'Clair', profile: 'Profil',
    autostart: 'Au démarrage', autostartHelp: 'S’ouvre avec Windows', desktop: 'Icône sur le Bureau', desktopHelp: 'Pour le relancer vite',
    back: 'Retour', install: 'Installer',
    profiles: { custom: ['Libre', 'Toutes les apps, tu choisis toi-même.'], office: ['Bureautique', 'Notes, presse-papiers et focus. Calme, sans confettis.'], dev: ['Développement', 'Claude Code, Git et serveurs locaux sur l’accueil.'],
      gaming: ['Gaming', 'Musique et système, et l’island se cache pendant tes jeux.'], music: ['Musique', 'Studio, métronome, niveau de sortie et tes logiciels de son.'] },
    workKicker: 'Installation', workTitle: 'Pip installe WinLand…', unKicker: 'Désinstallation', unTitle: 'Pip range ses affaires…',
    steps: { close: 'Fermeture de WinLand', copy: 'Copie des fichiers', shortcuts: 'Création des raccourcis', register: 'Ajout aux applications installées', settings: 'Tes réglages', done: 'Terminé' },
    unsteps: { close: 'Fermeture de WinLand', shortcuts: 'Suppression des raccourcis', register: 'Retrait des applications installées', settings: 'Tes réglages', done: 'Terminé' },
    doneKicker: 'C’est prêt', doneTitle: 'WinLand est <em>installé</em> !', doneLead: 'Pip t’attend en haut de ton écran. Passe la souris dessus pour ouvrir l’island.',
    tip1: 'Survole le haut de l’écran pour ouvrir WinLand', tip2: 'Les paramètres sont dans le menu de l’island et dans Démarrer',
    close: 'Fermer', launch: 'Lancer WinLand', retry: 'Réessayer',
    byeKicker: 'Désinstallation', byeTitle: 'Tu nous <em>quittes</em> ?', byeLead: 'WinLand et ses raccourcis vont être retirés de ce PC. Pip va un peu s’ennuyer.',
    keep: 'Garder mes réglages', keepHelp: 'Pratique si tu réinstalles WinLand plus tard', cancel: 'Annuler', uninstall: 'Désinstaller',
    goneKicker: 'C’est fait', goneTitle: 'À <em>bientôt</em> !', goneLead: 'WinLand a été désinstallé. Merci d’avoir passé du temps avec Pip.',
    say: { welcome: 'Salut !', options: 'Fais-toi plaisir', work: 'Je m’en occupe…', done: 'Trop bien !', bye: 'Oh non…', gone: 'Bye bye' },
    error: 'Quelque chose a coincé :'
  },
  en: {
    kicker: 'Setup', welcome: 'Welcome to <em>WinLand</em>', welcomeLead: 'Your Dynamic Island for Windows, with Pip. It lives at the top of your screen and stays 100 % on your PC.',
    f1: 'Follows Claude Code and Codex while they work', f2: 'Your music, focus and files at hand', f3: 'Nothing online: everything stays with you',
    start: 'Get started', update: v => `WinLand <b>${v}</b> is already installed: it will be updated, your settings stay.`,
    optTitle: 'Your WinLand', optLead: 'You can change everything later in the settings.', lang: 'Language', theme: 'Theme', dark: 'Dark', light: 'Light', profile: 'Profile',
    autostart: 'Start with Windows', autostartHelp: 'WinLand opens by itself', desktop: 'Desktop shortcut', desktopHelp: 'To start it again quickly',
    back: 'Back', install: 'Install',
    profiles: { custom: ['Free', 'Every app, you choose yourself.'], office: ['Office', 'Notes, clipboard and focus. Calm, no confetti.'], dev: ['Development', 'Claude Code, Git and local servers on the home screen.'],
      gaming: ['Gaming', 'Music and system, and the island hides while you play.'], music: ['Music', 'Studio, metronome, output level and your audio software.'] },
    workKicker: 'Setup', workTitle: 'Pip is installing WinLand…', unKicker: 'Uninstall', unTitle: 'Pip is packing up…',
    steps: { close: 'Closing WinLand', copy: 'Copying files', shortcuts: 'Creating shortcuts', register: 'Adding to installed apps', settings: 'Your settings', done: 'Done' },
    unsteps: { close: 'Closing WinLand', shortcuts: 'Removing shortcuts', register: 'Removing from installed apps', settings: 'Your settings', done: 'Done' },
    doneKicker: 'All set', doneTitle: 'WinLand is <em>installed</em>!', doneLead: 'Pip is waiting at the top of your screen. Move your mouse there to open the island.',
    tip1: 'Hover the top of the screen to open WinLand', tip2: 'Settings are in the island’s menu and in Start',
    close: 'Close', launch: 'Launch WinLand', retry: 'Try again',
    byeKicker: 'Uninstall', byeTitle: 'Leaving <em>already</em>?', byeLead: 'WinLand and its shortcuts will be removed from this PC. Pip will be a bit bored.',
    keep: 'Keep my settings', keepHelp: 'Handy if you install WinLand again later', cancel: 'Cancel', uninstall: 'Uninstall',
    goneKicker: 'Done', goneTitle: 'See you <em>soon</em>!', goneLead: 'WinLand has been uninstalled. Thanks for spending time with Pip.',
    say: { welcome: 'Hi there!', options: 'Make it yours', work: 'On it…', done: 'Awesome!', bye: 'Oh no…', gone: 'Bye bye' },
    error: 'Something got stuck:'
  }
};
const PROFILES = [
  ['custom', '#8e8e93', '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>'],
  ['office', '#ffd60a', '<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>'],
  ['dev', '#64d2ff', '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/>'],
  ['gaming', '#30d158', '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M17.5 13.5h.01"/>'],
  ['music', '#bf5af2', '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>']
];
const choice = { lang: 'fr', theme: 'dark', profile: 'custom', autostart: true, desktop: true, keepSettings: true };
const w = () => WORDS[choice.lang];
const FLOW = MODE === 'uninstall' ? ['bye', 'work', 'gone'] : ['welcome', 'options', 'work', 'done'];
let page = FLOW[0], working = false;

// ---------- texts ----------
function texts() {
  document.documentElement.lang = choice.lang;
  for (const el of $$('[data-t]')) { const v = w()[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; }
  $('#ver').textContent = VERSION ? 'v' + VERSION : '';
  if (INSTALLED && MODE === 'install') { $('#update').hidden = false; $('#update').innerHTML = w().update(INSTALLED); }
  $('#profiles').innerHTML = PROFILES.map(([id, c, svg]) => `<button class="prof ${choice.profile === id ? 'on' : ''}" data-prof="${id}" style="--c:${c}"><span><svg viewBox="0 0 24 24">${svg}</svg></span>${w().profiles[id][0]}</button>`).join('');
  $('#phelp').textContent = w().profiles[choice.profile][1];
  say(w().say[page]);
  segs();
}
function segs() {
  for (const seg of $$('[data-seg]')) {
    const on = seg.querySelector(`[data-v="${choice[seg.dataset.seg]}"]`), knob = seg.querySelector('.knob');
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === on));
    if (on) { knob.style.left = on.offsetLeft + 'px'; knob.style.width = on.offsetWidth + 'px'; }
  }
}
let sayTimer;
function say(text) {
  const el = $('#say'); el.classList.remove('on'); clearTimeout(sayTimer);
  if (!text) return;
  sayTimer = setTimeout(() => { el.textContent = text; el.classList.add('on'); sayTimer = setTimeout(() => el.classList.remove('on'), 3200); }, 260);
}

// ---------- pages ----------
function go(next) {
  const from = FLOW.indexOf(page), to = FLOW.indexOf(next);
  for (const el of $$('.page')) {
    const on = el.dataset.page === next;
    el.classList.toggle('left', !on && FLOW.indexOf(el.dataset.page) < to);
    el.classList.toggle('on', on);
  }
  page = next;
  document.body.className = { work: MODE === 'uninstall' ? 'busy bye' : 'busy', done: 'done', bye: 'bye', gone: 'gone' }[next] || '';
  $('#dots').innerHTML = FLOW.map((p, i) => `<i class="${i === to ? 'on' : i < to ? 'past' : ''}"></i>`).join('');
  say(w().say[next]);
  if (next === 'options') requestAnimationFrame(segs);
  if (next === 'done') confetti();
}

// ---------- the work ----------
const ORDER = { install: ['close', 'copy', 'shortcuts', 'register', 'settings'], uninstall: ['close', 'shortcuts', 'register', 'settings'] };
function checks(current) {
  const keys = ORDER[MODE], names = MODE === 'uninstall' ? w().unsteps : w().steps, at = keys.indexOf(current);
  $('#checks').innerHTML = keys.map((k, i) => `<div class="chk ${current === 'done' || i < at ? 'ok' : i === at ? 'now' : ''}"><i><svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.3 2.3L9.5 3.8"/></svg></i>${names[k]}</div>`).join('');
  $('#stepText').textContent = names[current] || '';
}
let shown = 0, target = 0;
(function count() { shown += (target - shown) * 0.12; $('#pct').textContent = Math.round(shown); requestAnimationFrame(count); })();
window.setup.onProgress(({ key, progress }) => { target = Math.round(progress * 100); $('#fill').style.width = target + '%'; checks(key); });
async function work() {
  working = true; $('#close').disabled = true; $('#err').classList.remove('on'); $('#retry').hidden = true;
  $('#workKicker').textContent = MODE === 'uninstall' ? w().unKicker : w().workKicker;
  $('#workTitle').textContent = MODE === 'uninstall' ? w().unTitle : w().workTitle;
  target = 0; shown = 0; $('#fill').style.width = '0%'; checks(ORDER[MODE][0]);
  go('work');
  const started = Date.now();
  const r = await (MODE === 'uninstall' ? window.setup.uninstall({ keepSettings: choice.keepSettings }) : window.setup.install(choice));
  await new Promise(res => setTimeout(res, Math.max(0, 1600 - (Date.now() - started)))); // long enough to see Pip work
  working = false; $('#close').disabled = false;
  if (r?.ok) { target = 100; $('#fill').style.width = '100%'; checks('done'); setTimeout(() => go(MODE === 'uninstall' ? 'gone' : 'done'), 650); return; }
  $('#err').textContent = w().error + ' ' + (r?.error || '?'); $('#err').classList.add('on'); $('#retry').hidden = false;
  document.body.className = ''; say('…');
}

// ---------- clicks ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button, .tog'); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.v) { const key = b.closest('[data-seg]').dataset.seg; choice[key] = b.dataset.v;
    if (key === 'theme') document.documentElement.dataset.theme = choice.theme; texts(); return; }
  if (b.dataset.prof) { choice.profile = b.dataset.prof; texts(); say(w().profiles[choice.profile][0] + ' !'); return; }
  if (b.dataset.tog) { choice[b.dataset.tog] = !choice[b.dataset.tog]; b.classList.toggle('on', choice[b.dataset.tog]); return; }
  if (b.dataset.act === 'close') return window.setup.close();
  if (b.dataset.act === 'launch') return window.setup.launch();
  if (b.id === 'doInstall' || b.id === 'doUninstall' || b.id === 'retryBtn') return work();
});
$('#min').onclick = () => window.setup.minimize();
$('#close').onclick = () => { if (!working) window.setup.close(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !working && page !== 'work') window.setup.close();
  if (e.key === 'Enter' && !working) { const main = $('.page.on .btn.main, .page.on .btn.danger'); main?.click(); }
});

// ---------- Pip looks at your mouse ----------
document.addEventListener('mousemove', e => {
  const r = $('#pip').getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, d / 260);
  $('#eyes').style.setProperty('--lx', (dx / d * 16 * k).toFixed(1) + 'px');
  $('#eyes').style.setProperty('--ly', (dy / d * 12 * k).toFixed(1) + 'px');
});
$('#pip').addEventListener('click', () => { const p = $('#pip'); p.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1,.9)' }, { transform: 'scale(.95,1.06)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.3,1.6,.5,1)' }); say(w().say.welcome); });

// ---------- confetti ----------
function confetti() {
  const cv = $('#confetti'), c = cv.getContext('2d'), W = cv.width = cv.offsetWidth * devicePixelRatio, H = cv.height = cv.offsetHeight * devicePixelRatio;
  const colours = ['#7c5cff', '#1aa7ff', '#30d158', '#ffd60a', '#ff375f', '#ffffff'];
  const bits = Array.from({ length: 140 }, () => ({ x: W * (0.15 + Math.random() * 0.25), y: H * 0.42, vx: (Math.random() - 0.3) * 18, vy: -Math.random() * 22 - 8,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, s: (4 + Math.random() * 6) * devicePixelRatio, col: colours[Math.floor(Math.random() * colours.length)] }));
  const t0 = performance.now();
  (function frame(now) {
    c.clearRect(0, 0, W, H);
    for (const b of bits) { b.vy += 0.55; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.col; c.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); c.restore(); }
    if (now - t0 < 4000) requestAnimationFrame(frame); else c.clearRect(0, 0, W, H);
  })(t0);
}

// ---------- start ----------
texts(); go(page);
</script>
</body></html>
