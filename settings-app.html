<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>WinLand Instellingen</title>
<!--
  WinLand Instellingen (settings-app-main.cjs): its own app, next to WinLand itself.
  Algemeen and Pip: the island's own lists (settings-bridge-ui.js), so every option works exactly like before.
  AI & Chat: which AI Pip's chat uses (the agents connected in Verbindingen).
  Apps: which apps are in your WinLand. Nieuws: our updates, from the releases on GitHub.
-->
<style>
  /* the island's motion vocabulary */
  :root{--wl-ease-out:cubic-bezier(.23,1,.32,1);--wl-ease-in-out:cubic-bezier(.77,0,.175,1);--wl-ease-drawer:cubic-bezier(.32,.72,0,1);--wl-spring:linear(0,0.005 1.1%,0.029 2.8%,0.074 4.9%,0.139 7.2%,0.22 9.8%,0.309 12.5%,0.402 15.4%,0.491 18.4%,0.575 21.6%,0.652 24.9%,0.718 28.3%,0.776 31.9%,0.825 35.5%,0.864 39.2%,0.895 43.1%,0.921 47%,0.941 51%,0.956 55.1%,0.968 59.2%,0.976 63.5%,0.983 67.8%,0.988 72.2%,0.991 76.7%,0.994 81.2%,0.996 85.8%,0.997 90.5%,0.998 95.2%,1);--wl-spring-bounce:linear(0,0.005 1.1%,0.029 2.8%,0.076 4.9%,0.146 7.2%,0.233 9.8%,0.336 12.5%,0.441 15.4%,0.546 18.4%,0.643 21.6%,0.732 24.9%,0.808 28.3%,0.869 31.9%,0.919 35.5%,0.955 39.2%,0.981 43.1%,0.998 47%,1.008 51%,1.013 55.1%,1.015 59.2%,1.014 63.5%,1.012 67.8%,1.01 72.2%,1.007 76.7%,1.005 81.2%,1.004 85.8%,1.002 90.5%,1.001 95.2%,1)}
  :root{
    --bg:#0e0f11;--side:#131416;--card:#17181b;--card2:#1c1d21;--raised:#202125;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);
    --text:#ececee;--text2:#b6b7be;--strong:#ffffff;--dim:#8a8b93;--faint:#5c5d65;
    --accent:#c6e994;--accent-ink:#15200c;--accent-text:#c6e994;--accent-soft:rgba(198,233,148,.12);--accent-line:rgba(198,233,148,.35);
    --input:#111214;--input-line:#2a2b30;--chip:#1f2024;--btn:#232428;--btn-hover:#2c2d32;--toggle-off:#3a3b41;--soft:rgba(255,255,255,.04);--soft2:rgba(255,255,255,.07);
    --warn:#ffb35c;--bad:#ff6b6b;--good:#8fd65a;
    --stage:radial-gradient(120% 90% at 50% 0%,#24262b 0%,#16171a 60%,#121315 100%);--beam:rgba(255,255,255,.10);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 0 0 1px var(--line);
    --pop:0 18px 50px rgba(0,0,0,.45),0 0 0 1px var(--line2);
    --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f6f6f8;--side:#eeeef1;--card:#ffffff;--card2:#fafafb;--raised:#ffffff;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
    --text:#1a1b1e;--text2:#45464d;--strong:#0b0c0e;--dim:#6e6f77;--faint:#9c9da5;
    --accent:#b5e07c;--accent-ink:#15200c;--accent-text:#4c8a1c;--accent-soft:rgba(110,180,50,.12);--accent-line:rgba(90,160,40,.4);
    --input:#ffffff;--input-line:#d9dae0;--chip:#f1f1f4;--btn:#ececf0;--btn-hover:#e2e2e8;--toggle-off:#cfd0d6;--soft:rgba(0,0,0,.035);--soft2:rgba(0,0,0,.06);
    --stage:radial-gradient(120% 90% at 50% 0%,#ffffff 0%,#f1f1f4 60%,#e8e8ec 100%);--beam:rgba(255,255,255,.8);
    --shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line);
    --pop:0 18px 50px rgba(0,0,0,.14),0 0 0 1px var(--line);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  button,input{font:inherit;color:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
  svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}
  .drag{position:fixed;left:0;right:150px;top:0;height:44px;-webkit-app-region:drag;z-index:5}
  .hidden{display:none !important}

  /* ---------- sidebar ---------- */
  aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px 12px}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;height:52px;flex:none}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand b{display:block;font:600 14px/1.15 var(--display);letter-spacing:-.005em}
  .brand span{display:block;font-size:12px;color:var(--dim)}
  .brand .beta{margin-left:auto;align-self:flex-start;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-style:normal;padding:2px 7px;border-radius:6px;background:var(--soft2);color:var(--dim)}
  nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{width:0}
  nav .sec{margin:16px 10px 6px;font-size:11.5px;font-weight:600;color:var(--faint)}
  nav .sec:first-child{margin-top:2px}
  nav button{position:relative;display:flex;align-items:center;gap:11px;border:0;background:transparent;border-radius:8px;height:36px;padding:0 10px;text-align:left;font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .12s,color .12s}
  nav button:hover{background:var(--soft);color:var(--text)}
  nav button.active{background:var(--soft2);color:var(--strong);font-weight:600}
  nav button.active::before{content:"";position:absolute;left:-2px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
  nav button svg{color:var(--dim)}
  nav button.active svg{color:var(--accent-text)}
  nav button em{font-style:normal;flex:1}
  nav button .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:none}
  nav button .dot.on{display:block}
  .me{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 8px 2px;border-top:1px solid var(--line);flex:none}
  .me .avatar{width:36px;height:36px;border-radius:10px;background:var(--stage);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
  .me .avatar img{width:44px;height:44px;margin-top:6px}
  .me div{flex:1;min-width:0}
  .me b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me small{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .iconbtn:hover{background:var(--soft2);color:var(--text)}

  /* ---------- main ---------- */
  main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  header{padding:52px 48px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;max-width:944px;width:100%}
  header h1{margin:0;font:600 26px/1.15 var(--display);letter-spacing:-.02em;color:var(--strong)}
  header p{margin:6px 0 0;color:var(--dim);font-size:13.5px}
  .search{position:relative;flex:none;-webkit-app-region:no-drag}
  .search.off{visibility:hidden}
  .search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--faint)}
  .search input{width:240px;height:36px;border-radius:9px;border:1px solid var(--input-line);background:var(--input);padding:0 12px 0 34px;font-size:13px;outline:none;user-select:text}
  .search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .scroll{flex:1;overflow:auto;padding:2px 48px 110px}
  .scroll.top{padding-top:56px}
  .scroll::-webkit-scrollbar{width:12px}.scroll::-webkit-scrollbar-thumb{background:var(--btn);border-radius:6px;border:4px solid var(--bg)}
  .scroll::-webkit-scrollbar-button{display:none;height:0}
  #list{max-width:848px}
  #list.fresh > *{animation:in .32s cubic-bezier(.2,.8,.2,1) both}
  #list.fresh > *:nth-child(2){animation-delay:.03s}#list.fresh > *:nth-child(3){animation-delay:.06s}#list.fresh > *:nth-child(4){animation-delay:.09s}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .empty{color:var(--dim);padding:40px 0;font-size:14px}
  .muted{color:var(--dim)}
  .card{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
  .section{margin:26px 2px 10px;font-size:13px;font-weight:600;color:var(--text)}
  .section:first-child{margin-top:0}
  .section small{font-weight:400;color:var(--dim);margin-left:8px}

  /* buttons and controls */
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;height:34px;padding:0 14px;background:var(--btn);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,transform .1s;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn:hover{background:var(--btn-hover)}.btn:active{transform:scale(.97)}
  .btn.main{background:var(--accent);color:var(--accent-ink)}.btn.main:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}.btn.ghost:hover{background:var(--soft)}
  .btn:disabled{opacity:.45;cursor:default}
  .switch,.tc-toggle[data-toggle],.tc-toggle[data-action="sleep"],.tc-toggle[data-login]{position:relative;flex:none;width:44px;height:24px;padding:0;border:0;border-radius:999px;font-size:0;color:transparent;background:var(--toggle-off);cursor:pointer;transition:background .2s}
  .switch::after,.tc-toggle[data-toggle]::after,.tc-toggle[data-action="sleep"]::after,.tc-toggle[data-login]::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .45s var(--wl-spring),width .2s var(--wl-ease-out)}
  .switch:active::after,.tc-toggle[data-toggle]:active::after,.tc-toggle[data-action="sleep"]:active::after,.tc-toggle[data-login]:active::after{width:24px}
  .switch.on:active::after,.tc-toggle.on[data-toggle]:active::after,.tc-toggle.on[data-action="sleep"]:active::after,.tc-toggle.on[data-login]:active::after{transform:translateX(14px)}
  .switch.on,.tc-toggle.on[data-toggle],.tc-toggle.on[data-action="sleep"],.tc-toggle.on[data-login]{background:var(--accent)}
  .switch.on::after,.tc-toggle.on[data-toggle]::after,.tc-toggle.on[data-action="sleep"]::after,.tc-toggle.on[data-login]::after{transform:translateX(20px)}
  .switch.on::after,.tc-toggle.on::after{background:var(--accent-ink)}
  :root[data-theme="light"] .switch.on::after,:root[data-theme="light"] .tc-toggle.on::after{background:#fff}
  .switch:disabled{opacity:.4;cursor:default}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft2);color:var(--text2);white-space:nowrap}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
  .tag.good{background:var(--accent-soft);color:var(--accent-text)}
  .tag.good i{background:var(--good)}
  .tag.warn{background:rgba(255,179,92,.14);color:var(--warn)}

  /* a grouped list: rows in one card, divided by thin lines (like Windows Settings) */
  .group{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .group + .group{margin-top:12px}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:64px}
  .row + .row{border-top:1px solid var(--line)}
  .row .text{flex:1;min-width:0}
  .row b{display:block;font-size:14px;font-weight:600;color:var(--strong)}
  .row small{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.4}
  .row .note{display:block;margin-top:6px;font-size:12px;color:var(--warn)}
  .row.soon{opacity:.6}
  .tile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,var(--text))}
  .tile svg{width:20px;height:20px}
  :root[data-theme="light"] .tile{color:color-mix(in srgb,var(--c,#888) 62%,#000);background:color-mix(in srgb,var(--c,#888) 22%,transparent)}
  .bot{position:relative;display:inline-block;width:40px;height:32px;border-radius:12px;background:var(--c,#ddd);box-shadow:inset 0 -4px 8px rgba(0,0,0,.18);flex:none}
  .bot::before,.bot::after{content:"";position:absolute;top:11px;width:5px;height:9px;border-radius:3px;background:#161616}
  .bot::before{left:12px}.bot::after{right:12px}
  .bot.off{filter:grayscale(1);opacity:.45}
  .bot.busy{animation:bob 1s ease-in-out infinite}
  .bot.sm{width:22px;height:18px;border-radius:7px}.bot.sm::before,.bot.sm::after{top:6px;width:3px;height:6px}.bot.sm::before{left:6px}.bot.sm::after{right:6px}
  @keyframes bob{50%{transform:translateY(-3px)}}

  /* ---------- the island's lists (Algemeen, Pip), in the same grouped style ---------- */
  .tc-group{margin:26px 2px 10px;font-size:13px;font-weight:600;color:var(--text)}
  .tc-group:first-child,.robo-hero + .tc-group{margin-top:0}
  .tc-group[data-icon]::before{content:none}
  .tc-setting-row{display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--card);padding:14px 18px;min-height:64px;border-top:1px solid var(--line);box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line);transition:background .12s}
  .tc-setting-row:hover{background:var(--card2)}
  .tc-setting-row.tc-demo{cursor:pointer}
  .tc-group + .tc-setting-row,.tc-setting-row.first{border-top:0;border-radius:12px 12px 0 0;box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line),0 -1px 0 var(--line)}
  .tc-setting-row.last{border-radius:0 0 12px 12px;box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line),0 1px 0 var(--line)}
  .tc-setting-row.first.last,.tc-group + .tc-setting-row.last{border-radius:12px;box-shadow:var(--shadow)}
  .tc-setting-row > div:first-child{min-width:0}
  .tc-setting-row strong{display:block;font-size:14px;font-weight:600;color:var(--strong)}
  .tc-setting-row small{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.4}
  .tc-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:62%}
  .tc-chip{border:0;border-radius:7px;height:30px;padding:0 12px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
  .tc-chip:hover{background:var(--btn-hover);color:var(--text)}
  .tc-chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
  .tc-chip:disabled{opacity:.45;cursor:default}
  .tc-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;transition:transform .12s}
  .tc-swatch:hover{transform:scale(1.1)}
  .tc-swatch.on{border-color:var(--bg);box-shadow:0 0 0 2px var(--accent)}
  .tc-toggle{flex:none;border:0;cursor:pointer;border-radius:8px;height:32px;padding:0 14px;background:var(--btn);color:var(--text);font-size:13px;font-weight:600}
  .tc-step{display:flex;align-items:center;gap:8px}
  .tc-input,.field{width:240px;height:34px;border:1px solid var(--input-line);border-radius:8px;padding:0 11px;background:var(--input);font-size:13px;outline:none;user-select:text}
  .tc-input:focus,.field:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .tc-name{width:180px}
  .tc-step .tc-chip,.tc-step button:not(.tc-toggle){height:34px}
  .tc-lights{flex-direction:column;align-items:stretch;gap:10px}
  .tc-lights-head{display:flex;flex-direction:column;gap:10px}
  .tc-lights-head .tc-chips,.tc-light-line .tc-chips{justify-content:flex-start;max-width:none}
  .tc-light-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:9px;background:var(--soft)}
  .tc-light-line > span{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;white-space:nowrap}
  .tc-light-line > span i{width:10px;height:10px;border-radius:50%;display:block}
  .tc-preview{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
  .tc-preview i{width:6px;height:10px;border-radius:50%;display:block}
  .tc-tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
  .tc-tests .tc-chip{height:auto;padding:10px;border-radius:9px}
  .tc-badge{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 10px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);opacity:.5;text-align:center}
  .tc-badge.on{opacity:1;box-shadow:inset 0 0 0 1px var(--accent-line)}
  .tc-badge span{font-size:24px}.tc-badge b{font-size:13px}.tc-badge small{font-size:11px;color:var(--dim)}
  .tc-ai-error{color:#ff9d8f;font-size:13px;margin:10px 2px}

  /* Pip's own page: him, big, on top */
  .robo-hero{display:flex;align-items:center;gap:22px;margin-bottom:26px;padding:6px 26px 6px 6px;border-radius:14px;background:var(--stage);box-shadow:var(--shadow);overflow:hidden}
  .robo-hero img{width:150px;height:150px;flex:none}
  .robo-hero b{display:block;font:600 24px/1.15 var(--display);letter-spacing:-.02em;color:var(--strong)}
  .robo-hero small{display:block;color:var(--dim);margin-top:4px;font-size:13px}
  .robo-hero .bar{margin-top:14px;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden;max-width:320px}
  .robo-hero .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}

  /* ---------- Home ---------- */
  .greet{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
  .greet h2{margin:0;font:600 28px/1.15 var(--display);letter-spacing:-.02em;color:var(--strong)}
  .greet p{margin:6px 0 0;color:var(--dim);font-size:13.5px;max-width:520px}
  .agents{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .agent{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:12.5px;font-weight:600}
  .agent span{color:var(--dim);font-weight:500}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
  .kpi b{display:block;font:600 26px/1 var(--display);letter-spacing:-.02em;color:var(--strong)}
  .kpi small{display:block;color:var(--dim);font-size:12.5px;margin-top:5px}
  .setup{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:12px;margin-bottom:12px;background:linear-gradient(100deg,var(--accent-soft),transparent 70%),var(--card);box-shadow:inset 0 0 0 1px var(--accent-line)}
  .setup div{flex:1}
  .setup b{display:block;font-size:14.5px}
  .setup small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
  .home{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}
  .hist-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}
  .hist-head b{font-size:13px;font-weight:600}
  .hist-head .field{width:220px;height:32px}
  .day{font-size:12px;font-weight:600;color:var(--faint);padding:12px 18px 4px;background:var(--card)}
  .group .day:first-child{padding-top:14px}
  .job{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:10px 18px 12px;background:var(--card)}
  .job .bot{margin-top:2px}
  .job p{margin:0;font-size:13.5px;line-height:1.45;color:var(--text)}
  .job small{display:block;margin-top:3px;color:var(--dim);font-size:12px}
  .job .res{font-size:12px;font-weight:600;white-space:nowrap;margin-top:1px}
  .job .res.done{color:var(--accent-text)}.job .res.question{color:var(--warn)}.job .res.error{color:var(--bad)}
  .side-cards{display:flex;flex-direction:column;gap:12px;margin-top:64px}
  .quick{display:flex;flex-direction:column}
  .quick button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px 16px;text-align:left;cursor:pointer;color:var(--text);font-size:13px;font-weight:600}
  .quick button + button{border-top:1px solid var(--line)}
  .quick button:hover{background:var(--card2)}
  .quick button .tile{width:32px;height:32px;border-radius:8px}
  .quick button .tile svg{width:17px;height:17px}
  .quick button > span:not(.tile){flex:1}
  .quick button > svg{color:var(--faint);width:16px;height:16px}
  .tip{position:relative;overflow:hidden;border-radius:12px;padding:16px 18px;background:var(--stage);box-shadow:var(--shadow)}
  .tip b{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .tip p{margin:6px 0 0;color:var(--dim);font-size:12.5px;line-height:1.5}

  /* ---------- Apps ---------- */
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .appcard{background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
  .appcard .top{display:flex;gap:12px;align-items:center}
  .appcard .top div{flex:1;min-width:0}
  .appcard .tile{width:42px;height:42px;border-radius:11px}
  .appcard.locked{opacity:.78}.appcard.locked .tile{filter:saturate(.35)}
  .card.packs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .card.packs .top{display:flex;gap:12px;align-items:center}.card.packs .top div{flex:1;min-width:0}.card.packs .tile{width:42px;height:42px;border-radius:11px}.card.packs .top small{display:block;margin-top:2px}
  .card.packs .code{display:flex;gap:8px}.card.packs .code input{flex:1;min-width:0;height:34px;border-radius:8px;border:1px solid var(--line, rgba(128,128,128,.3));background:transparent;color:var(--text);padding:0 12px;font:500 13px Consolas,monospace;letter-spacing:.04em}
  .card.packs .codemsg{margin:0;min-height:1em;font-size:12.5px}.card.packs .btn.small{align-self:flex-start}
  .btn.small{height:28px;padding:0 10px;font-size:12px}
  .appcard b{display:block;font-size:14px}
  .appcard small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
  .appcard small.in{color:var(--accent-text)}
  .appcard p{margin:0;color:var(--text2);font-size:12.5px;line-height:1.5;flex:1}
  .appcard.soon{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}

  /* ---------- Nieuws ---------- */
  .version{display:flex;align-items:center;gap:16px;margin-bottom:26px}
  .version div{flex:1}
  .version b{display:block;font-size:15px}
  .version small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
  .release{position:relative;padding-left:26px;margin-bottom:22px}
  .release::before{content:"";position:absolute;left:5px;top:20px;bottom:-22px;width:2px;background:var(--line)}
  .release:last-child::before{display:none}
  .release::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--btn);box-shadow:0 0 0 3px var(--bg)}
  .release.latest::after{background:var(--accent)}
  .release .rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .release .rhead b{font-size:15px}
  .release .rhead span{font-size:12px;color:var(--dim)}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,179,92,.14);color:var(--warn)}
  .pill.new{background:var(--accent-soft);color:var(--accent-text)}
  .notes{font-size:13.5px;line-height:1.6;color:var(--text2);user-select:text}
  .notes h4{margin:14px 0 4px;font-size:13.5px;color:var(--strong)}
  .notes h4:first-child{margin-top:0}
  .notes ul{margin:4px 0;padding-left:20px}
  .notes code{background:var(--chip);border-radius:5px;padding:1px 6px;font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
  .release .more{margin-top:12px}

  /* ---------- AI & Chat, Verbindingen ---------- */
  .lead{color:var(--dim);font-size:13.5px;margin:0 2px 18px;max-width:640px}

  /* toast and save bar */
  .toast{position:fixed;left:calc(50% + 124px);bottom:22px;transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:9px;background:var(--raised);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--pop);transition:all .22s;pointer-events:none;z-index:9}
  .toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
  .toast.bad::before{background:var(--bad)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .savebar{position:absolute;left:48px;right:48px;bottom:18px;max-width:848px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:12px;background:var(--raised);box-shadow:var(--pop);transform:translateY(140%);opacity:0;transition:transform .45s var(--wl-ease-drawer),opacity .2s;z-index:6}
  .savebar.on{transform:none;opacity:1}
  .savebar i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
  .savebar span{flex:1;font-size:13.5px;font-weight:600}
  .savebar small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:1px}

  :root[data-theme="light"] .face{filter:drop-shadow(0 8px 14px rgba(40,40,60,.18)) drop-shadow(0 1px 2px rgba(0,0,0,.12))}
  @media (max-width:980px){.home{grid-template-columns:1fr}.side-cards{margin-top:0}}
</style></head>

  });
  paint(`<p class="lead">${t().cxHow}</p><p class="section">${t().cxAgents}</p><div class="group">${rows.join('')}</div>`, false);
  $('#connectDot').classList.toggle('on', !cxs.list.some(c => c.on));
}
async function toggleConnect(id, on) {
  const name = t().cx[id][0];
  const r = await S.connect(id, on);
  if (r?.ok === false) { toast(r.error || '?', true); return loadConnect(); }
  cxNote[id] = on && (id === 'claudecode' || id === 'codex') ? t().cxRestart(name) + (id === 'codex' ? ' ' + t().cxCodexTrust : '') : '';
  cxs = r; drawConnect();
}

// ---------- clicks ----------
function go(where) { if (!TABS.includes(where) || where === tab) return; tab = where; localStorage.setItem('tab', tab); $('#search').value = ''; lastHtml = ''; labels(); render(true); }
list.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (tab === 'general' || tab === 'karakter') {
    if (b) { if (b.disabled) return; const index = islandIndex(b); if (index >= 0) press({ index }, b); return; }
    const row = e.target.closest('.tc-setting-row');
    if (row?.dataset.demo && !e.target.closest('input')) press({ row: [...list.querySelectorAll('.tc-setting-row')].indexOf(row) }); // a block with an example: Pip shows it
    return;
  }
  if (!b || b.disabled) return;
  if (b.dataset.goto) return go(b.dataset.goto);
  if (tab === 'connect' && b.dataset.cx) { b.classList.toggle('on'); toggleConnect(b.dataset.cx, b.classList.contains('on')); return; }
  if (tab === 'ai') {
    const act = b.dataset.ai;
    if (act === 'login') { loggingIn = true; drawAi(); aiAction(() => S.ai.chatgptLogin(), 'ChatGPT ✓').finally(() => { loggingIn = false; drawAi(); }); }
    if (act === 'cancel') { S.ai.chatgptCancel(); loggingIn = false; drawAi(); }
    if (act === 'logout') aiAction(() => S.ai.chatgptLogout());
    if (act === 'connect') go('connect');
  }
  if (tab === 'apps' && b.dataset.app) {
    const a = APPS.find(x => x.id === b.dataset.app), on = b.dataset.on === '1';
    b.classList.toggle('on', on);
    loadApps({ kind: 'app', id: a.id, on }).then(() => toast(on ? t().added(a[lang][0]) : t().removed(a[lang][0])));
  }
});
// the island counts the buttons of its own list (the hero on Pip's page is ours, so it is left out)
function islandIndex(b) { return [...list.querySelectorAll('button')].filter(x => !x.closest('.robo-hero')).indexOf(b); }
list.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.matches('input[id^="tc-in-"]')) { e.preventDefault(); e.target.closest('.tc-step')?.querySelector('button')?.click(); }
});

// ---------- tabs and search ----------
async function render(fresh) {
  if (tab === 'home') { if (fresh) lastHtml = ''; showInfo((await S.get({ kind: 'apps' }))?.info); await loadHome(); }
  if (tab === 'connect') { if (fresh) lastHtml = ''; await loadConnect(); }
  if (tab === 'general' || tab === 'karakter') { const html = await islandList(tab); if (html != null) paintIsland(html, fresh); }
  if (tab === 'ai') { if (fresh) lastHtml = ''; await loadAi(); }
  if (tab === 'apps') { if (fresh) lastHtml = ''; await loadApps(); }
  if (fresh) { scroll.scrollTop = 0; list.classList.remove('fresh'); void list.offsetWidth; list.classList.add('fresh'); clearTimeout(freshTimer); freshTimer = setTimeout(() => list.classList.remove('fresh'), 520); }
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
function filter() {
  if (!['general', 'karakter'].includes(tab)) return;
  const q = $('#search').value.trim().toLowerCase(), items = [...list.children];
  let shown = 0;
  for (const el of items) {
    if (el.classList.contains('tc-group') || el.classList.contains('moved') || el.classList.contains('empty')) continue;
    const hit = !q || el.textContent.toLowerCase().includes(q);
    el.classList.toggle('hidden', !hit); if (hit && el.classList.contains('tc-setting-row')) shown++;
  }
  items.forEach((el, i) => { // a group title only shows when something under it does
    if (!el.classList.contains('tc-group')) return;
    let any = false;
    for (let j = i + 1; j < items.length && !items[j].classList.contains('tc-group'); j++) if (!items[j].classList.contains('hidden')) { any = true; break; }
    el.classList.toggle('hidden', !any);
  });
  let empty = list.querySelector(':scope > .empty');
  if (q && !shown) { if (!empty) { empty = document.createElement('p'); empty.className = 'empty'; list.appendChild(empty); } empty.textContent = t().none; }
  else if (q || shown) empty?.remove();
  corners();
}
$('#search').addEventListener('input', filter);
addEventListener('keydown', e => { if (e.ctrlKey && e.key.toLowerCase() === 'f' && !$('#searchBox').classList.contains('off')) { e.preventDefault(); $('#search').focus(); } });

// ---------- Pip, live ----------
let lastFace = '';
S.onFace(url => { lastFace = url; document.querySelectorAll('.face').forEach(img => { img.src = url; }); });

// keep up with changes made elsewhere, but never while you type
addEventListener('focus', () => { if (!typing() && !busy) render(false); });
setInterval(() => { if (!document.hidden && !busy && !typing() && ['general', 'karakter', 'apps', 'home', 'connect'].includes(tab)) render(false); }, 3000);
window.settingsApp.onGoto?.(where => go(where));

labels();
render(true);
loadAi();   // the red dot on AI & Chat when nothing is connected yet
</script></body></html>
